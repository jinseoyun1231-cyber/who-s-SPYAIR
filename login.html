<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's SPYAIR - Login</title>
    <link rel="stylesheet" href="css/navigaitionStyle.css">
    <style>
        #loginForm {
            width: 500px;
            margin: 0 auto;
            margin-top: 30px;
            padding: 20px;
            border: none;
            border: 1px solid rgba(51, 50, 49, 0.8);
            height: 330px;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        input[type="text"], input[type="password"] {    
            width: 483px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            height: 30px;
            font-size: 20px;
        }
        input[type="submit"] {
            width: 500px;
            padding: 8px;
            background-color: rgba(51, 50, 49, 0.8);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 20px;
            text-align: center;
        }
        input[type="submit"]:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>
    <header>
        <div class="navigation" id="home"><h2><b><a href="http://127.0.0.1:5500/home.html">Who's SPYAIR</a></b></h2></div>
        <div class="navigation" id="songs"><h2><a href="http://127.0.0.1:5500/songs.html">Songs</a></h2></div>
        <div class="navigation" id="history"><h2><a href="http://127.0.0.1:5500/history.html">History</a></h2></div>
        <div class="navigation" id="concerts"><h2><a href="http://127.0.0.1:5500/concerts.html">Concerts</a></h2></div>
        <div class="navigation" id="login"><h2><a href="http://127.0.0.1:5500/login.html">Login</a></h2></div>
    </header>
    <main>
        <div class="contentHome" id="login">
            <div id="title"><h2>로그인</h2></div>
            <hr>
            <div id="loginForm">
                <form action="http://127.0.0.1:5500/home.html">
                    <label for="username"><h3>ID</h3></label>
                    <input type="text" id="username" name="username" required>
                    <br><br>
                    <label for="password"><h3>Password</h3></label>
                    <input type="password" id="password" name="password" required>
                    <br><br>
                    <input type="submit" value="Login">
                </form>
            </div>
            <br><br><br><br><br><br><br>
        </div>
    </main>
    <footer>
        
</body>
</html>
