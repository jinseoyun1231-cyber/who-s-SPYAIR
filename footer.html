<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      a {
        /*링크 연결 된 글씨*/
        color: #fff; /*링크 있는 글씨도 보라색, 파란색 말고 하얀색으로*/
        text-decoration: none; /*글씨에 밑줄 없앰*/
      }
      footer {
        /*푸터*/
        margin-left: 30px; /*왼 쪽 여백*/
        margin-top: 20px; /*위 쪽 여백*/
        font-size: 10px; /*글씨 사이즈*/
        font-family: Arial, sans-serif; /*폰트 정하기*/
      }
      .footericon {
        /*푸터 이미지 아이콘*/
        width: 15px; /*길이*/
        height: 15px; /*높이*/
        border-radius: 5px; /*둥근 모서리*/
        margin-right: 5px; /*글씨랑 아이콘이랑 띄우기*/
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <footer>
      <a href="https://www.youtube.com/@spyairSMEJ" target="_top">
        <img src="images/youtubeLogo.png" alt="YouTube" class="footericon" />
        <span class="link">SPYAIR Official YouTube Channel</span>
      </a>
      <div class="clearfix"></div>
      <a href="https://x.com/SPYAIRSTAFF" target="_top">
        <img src="images/X.png" alt="X" class="footericon" />
        <span class="link">SPYAIR Official X</span>
      </a>
      <div class="clearfix"></div>
      <a href="https://www.instagram.com/spyair.official/" target="_top">
        <img src="images/instaLogo.png" alt="Instagram" class="footericon" />
        <span class="link">SPYAIR Official Instagram</span>
      </a>
      <div class="clearfix"></div>
      <a
        href="https://line.me/R/ti/p/@spyair?from=page&openQrModal=true&searchId=spyair"
        target="_top"
      >
        <img src="images/line.png" alt="line" class="footericon" />
        <span class="link">SPYAIR Official Line QR</span>
      </a>
      <div class="clearfix"></div>
      <a href="https://www.facebook.com/spyairofficial" target="_top">
        <img src="images/facebook.png" alt="facebook" class="footericon" />
        <span class="link">SPYAIR Official facebook</span>
      </a>
      <div class="clearfix"></div>
      <a href="https://www.tiktok.com/@spyair_official" target="_top">
        <img src="images/tiktok.png" alt="tiktok" class="footericon" />
        <span class="link">SPYAIR Official TikTok</span>
      </a>
    </footer>
  </body>
</html>
